plugins {
    id 'com.android.application'
}

android {
    namespace 'mg.hira.vavaka.fiaram.testbuild'
    compileSdk 35

    defaultConfig {
        applicationId 'mg.hira.vavaka.fiaram.release130'
        minSdk 19
        targetSdk 30
        versionCode 140
        versionName '1.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = 'HIRA_VAVAKA_FIARAM_v1.4.0_BAIBOLY_SHELL.apk'
        }
    }
}
