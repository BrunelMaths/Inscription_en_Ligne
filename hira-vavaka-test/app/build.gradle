plugins {
    id 'com.android.application'
}

android {
    namespace 'mg.hira.vavaka.fiaram.testbuild'
    compileSdk 35

    defaultConfig {
        applicationId 'mg.hira.vavaka.fiaram.safe132'
        minSdk 19
        targetSdk 30
        versionCode 132
        versionName '1.3.2-install-safe'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = 'HIRA_VAVAKA_FIARAM_v1.3.2_INSTALL_SAFE.apk'
        }
    }
}
